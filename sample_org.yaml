# Illustrative sample input, built from Longview Philanthropy's public careers page
# (https://www.longview.org/careers/chief-operating-officer/) — not internal data.
organization: "Longview Philanthropy"

# Approximate current departments/headcount per the public JD ("~35 staff,
# four departments: operations, donor advising, AI grantmaking, nuclear grantmaking")
current_headcount:
  operations: 8
  donor_advising: 9
  ai_grantmaking: 10
  nuclear_grantmaking: 8

# JD: "design and execute the operations and hiring strategy to double headcount"
target_multiplier: 2.0
timeline_months: 18

# Illustrative placeholders only — NOT real Longview comp figures. A manager/lead
# hire is modeled as costing more than an IC hire (per Finance-lens feedback: a flat
# blended rate makes a manager-heavy phase look as cheap as an IC-heavy one, which
# understates early-phase cost). Swap both for Longview's real comp bands before
# using this for anything but a demonstration.
avg_fully_loaded_cost_per_fte: 165000
avg_fully_loaded_cost_manager: 205000

# Illustrative placeholder — the dollar level at which a budget or grant commitment
# escalates from Finance/Grants Management's own authority to COO (or CEO)
# accountability. An undefined threshold makes that RACI row decorative rather than
# something a Finance or Grants lead can actually operate against.
budget_commitment_threshold: 50000

# JD: "stay on top of regulatory requirements across the jurisdictions we operate in"
jurisdictions:
  - name: "US"
    entity_type: "501(c)(3)/(c)(4)"
  - name: "UK"
    entity_type: "UK registered charity"

# JD: "manage and coach People Operations, Business Operations, Finance,
# Talent, and Grants Management leads"
functional_leads:
  - "People Operations"
  - "Business Operations"
  - "Finance"
  - "Talent"
  - "Grants Management"

# Data-architect note: current_headcount's departments and functional_leads are two
# separate taxonomies pulled from different parts of Longview's public JD, and they
# don't fully reconcile. "donor_advising" in particular isn't obviously owned by any
# of the five named leads above — mapped to null on purpose rather than guessed, since
# pretending it resolves cleanly would hide a real week-one question for the CEO.
department_functional_lead_map:
  operations: "Business Operations"
  donor_advising: null   # not obviously owned by any of the five named leads — ask the CEO
  ai_grantmaking: "Grants Management"
  nuclear_grantmaking: "Grants Management"
